# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# frame rate unlock (src/common/frame_rate.cpp): the gate's period, and the dropped ms carried into the next frame
[[hook]]
at = 0x1308D9
call = "FrameRate_Period"
after = true

[[hook]]
at = 0x130B23
call = "FrameRate_Period"
after = true

[[hook]]
at = 0x12FBCD
call = "FrameRate_CarryMs"

# the world's frame time from the exact elapsed time instead of whole milliseconds (src/common/frame_rate.cpp)
[[hook]]
at = 0x3D044
call = "FrameRate_Dt"

# true 16:9 and the fov setting: the x and y scales the camera passes to 0x5DD10 (src/common/widescreen.cpp)
[[hook]]
at = 0x2D6DA
call = "Widescreen_Scale"
